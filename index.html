<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zion MCP Security Checklist</title>
<meta name="description" content="Audit your Model Context Protocol setup: token scoping, transport security, OAuth, secrets handling, supply chain. Free tool by Zion Tech Group.">
<style>
:root{--bg:#0a1210;--card:#122019;--acc:#34d399;--txt:#e9f6ef;--mut:#93b3a4}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:48px 24px 24px;text-align:center;background:linear-gradient(160deg,#0d3325,#0a1210)}
h1{margin:0 0 8px}.wrap{max-width:860px;margin:0 auto;padding:24px}
.cat{margin:24px 0 8px;color:var(--acc);font-weight:600;text-transform:uppercase;font-size:.8rem;letter-spacing:.06em}
.item{display:flex;gap:12px;background:var(--card);border:1px solid #1d3a2c;border-radius:12px;padding:14px;margin:8px 0;align-items:center}
.item input{width:20px;height:20px;accent-color:var(--acc)}
.item small{color:var(--mut);display:block}
.score{position:sticky;bottom:16px;background:#0e2a1d;border:1px solid #1e5238;border-radius:14px;padding:16px;text-align:center;font-size:1.2rem;margin-top:24px}
.bar{height:10px;background:#0a1a12;border-radius:6px;margin-top:8px;overflow:hidden}.bar>div{height:100%;background:var(--acc);width:0;transition:width .3s}
footer{padding:32px 24px;text-align:center;color:var(--mut);font-size:.85rem;border-top:1px solid #18291f;margin-top:40px}
footer a{color:var(--acc);text-decoration:none;margin:0 8px}
</style>
</head>
<body>
<header><h1>🔐 Zion MCP Security Checklist</h1>
<p>Audit your Model Context Protocol deployment across 6 domains. Based on the 2026 MCP ecosystem: OAuth 2.1, Streamable HTTP, least-privilege tokens.</p></header>
<div class="wrap" id="app"></div>
<footer>Part of the <a href="https://ziontechgroup.com">Zion Tech Group</a> AI apps network ·
<a href="https://ziontechgroup.com/zion-mcp-finder/">MCP Finder</a>
<a href="https://ziontechgroup.com/zion-agent-stack-builder/">Agent Stack Builder</a>
<a href="https://github.com/Zion-support/zion-mcp-stack">zion-mcp-stack repo</a></footer>
<script>
const C={
'Tokens & credentials':['No tokens hardcoded in configs or committed to git','Least-privilege scopes per token (e.g. read-only where possible)','Restricted keys for payment APIs (rk_ not sk_)','Token rotation schedule defined','Secrets in a manager (Docker secrets, Vault, Doppler) not env files in prod'],
'Transport security':['Streamable HTTP or stdio — legacy SSE endpoints retired','TLS enforced on all remote endpoints','HTTP MCP servers not exposed publicly without auth','Reverse proxy with SSO/OAuth in front of team-facing servers'],
'OAuth & identity':['OAuth 2.1 used for hosted servers (GitHub, Stripe, Supabase, Notion)','Per-user identity preserved (no shared service tokens where user context matters)','OAuth client secrets stored server-side only'],
'Tool permissions':['Write/destructive tools disabled or approval-gated','Tool allowlists per agent/use case','Rate limits on outbound actions (email, messages, payments)'],
'Supply chain':['MCP servers pinned to versions/digests','Servers sourced from official orgs or audited forks','Archived/unmaintained servers flagged (e.g. browserbase)','Dependency scanning in CI'],
'Monitoring & response':['Tool-call logging with redaction','Anomaly alerts on tool-call volume','Kill switch to revoke all MCP tokens quickly','MCP incidents covered in incident runbook']};
const app=document.getElementById('app');let html='';
for(const[cat,items]of Object.entries(C)){html+=`<div class="cat">${cat}</div>`+items.map(t=>`<label class="item"><input type="checkbox"><span>${t}</span></label>`).join('');}
html+=`<div class="score"><div>Security posture: <b id="pct">0%</b> <span id="v" style="color:var(--mut);font-size:.9rem"></span></div><div class="bar"><div id="fill"></div></div></div>`;
app.innerHTML=html;
app.addEventListener('change',()=>{const b=[...app.querySelectorAll('input')];const p=Math.round(b.filter(x=>x.checked).length/b.length*100);
document.getElementById('pct').textContent=p+'%';document.getElementById('fill').style.width=p+'%';
document.getElementById('v').textContent=p>=90?'— strong':p>=70?'— good, close gaps':p>=40?'— exposed, prioritize tokens & transport':'— high risk';});
</script>
</body>
</html>
