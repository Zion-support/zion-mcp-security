<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>MCP Security Checklist</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}label{display:block;margin:.4rem 0}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🔐 MCP Security Checklist</h1><p>Check what your MCP server setup already covers.</p><div id="c"></div><button onclick="go()">Score my setup</button><div id="out"></div><script>const items=['Scoped, least-privilege tokens','TLS for all transports','OAuth 2.1 with PKCE','Tool allowlist (no wildcard *)','Rate limiting per client','Audit logging of tool calls','Input validation on tool args','Secrets in vault, not env files'];document.getElementById('c').innerHTML=items.map((x,i)=>`<label><input type="checkbox" id="c${i}"> ${x}</label>`).join('');function go(){let n=0;items.forEach((_,i)=>{if(document.getElementById('c'+i).checked)n++});document.getElementById('out').textContent=`Coverage: ${n}/${items.length} (${Math.round(n/items.length*100)}%)\n${n===items.length?'🟢 Well hardened!':'Gaps to close:\n'+items.filter((_,i)=>!document.getElementById('c'+i).checked).map(x=>'• '+x).join('\n')}\n\nFull MCP security review: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/zion-mcp-security">GitHub</a> · <a href="https://ziontechgroup.com/prompt-shield/">Prompt Shield</a></p></body></html>
